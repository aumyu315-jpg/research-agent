# Aurora — Netlify configuration
[build]
  # publish dir is the repo root; keep node_modules out of every deploy
  command = "rm -rf node_modules 2>/dev/null || true"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Give the web-search chain (SearXNG parallel + DDG fallback) room to finish
[functions.aurora]
  timeout = 26

# Route /api/* to the serverless function (static site calls same-origin /api)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/aurora/:splat"
  status = 200
  force = true
