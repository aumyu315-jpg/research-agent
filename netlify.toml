# Aurora — Netlify configuration
[build]
  # publish dir is the repo root. No build step needed — Netlify installs deps
  # automatically, and node_modules/ is gitignored so it never ships.
  # (Removed the old "rm -rf node_modules" hack: it deleted Netlify's installed
  # deps and would silently break git builds if a runtime dep is ever added.)
  command = "echo 'static site — no build step; functions bundled by esbuild'"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Give the web-search chain (SearXNG parallel + DDG fallback) room to finish
[functions.aurora]
  timeout = 26

# Route /api/* to the serverless function (static site calls same-origin /api)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/aurora/:splat"
  status = 200
  force = true
